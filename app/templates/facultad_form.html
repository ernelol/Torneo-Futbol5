{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<div class="tarjeta">
  <h1>{{ titulo }}</h1>
  <form method="post">
    <label>Nombre
      <input type="text" name="nombre" value="{{ f.nombre }}" maxlength="80" required>
    </label>
    <button type="submit">Guardar</button>
    <a class="boton gris" href="{{ url_for('facultades') }}">Cancelar</a>
  </form>
</div>
{% endblock %}
